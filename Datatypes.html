    <script>
        // 100 -Number Literals
        //"sanath" - String Literals
        
       // [10,20] - Array Literals

    //    }     

    // var a = 100; //number
    // var b = "200"; // string
    // var c = '300'; //string
    // var d = `400`; //string
    
     //Create a variable with integer value 
     var x=10;
     console.log(x);
    //Create a variable with octal number 

    var y=0o123;
    console.log(typeof y);


    //Create a variable and assign string value 
    var z="sai"
    console.log(typeof z);

  //Create a variable and assign undefined value 
    var a=
    console.log(a)

   //Create a variable and assign null value 
   var b=null
   console.log(b)

   //Create a variable and assign NaN value 
   var c=NaN
   console.log(c)

   //Create a variable and assign array 
   var d=[1,2,3,4,5,c];
   console.log(typeof d)

 //Create a variable and assign object literal  
 var e={
    name: "my name is sanath"
 }
 console.log(typeof e)
